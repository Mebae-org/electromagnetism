name: 課題02 直流回路 の提出
description: 第2章「直流回路」の課題を提出します
title: "[課題02] 直流回路"
labels: ["assignment", "ch02"]
body:
  - type: markdown
    attributes:
      value: |
        各問の答えを半角数字で入力してください。単位や途中式は入力しないでください。
        Issue の作成後、GitHub Actions が自動で採点します。回答を修正すると再採点されます。
  - type: input
    id: q1
    attributes:
      label: 問1
      description: "100 V の電圧を 40 Ω の抵抗に加えた。流れる電流は何 A か。数値のみを答えよ。"
      placeholder: "例: 2.5"
    validations:
      required: true
  - type: input
    id: q2
    attributes:
      label: 問2
      description: "8.0 Ω と 24 Ω の抵抗を直列に接続した。合成抵抗は何 Ω か。数値のみを答えよ。"
      placeholder: "例: 32"
    validations:
      required: true
  - type: input
    id: q3
    attributes:
      label: 問3
      description: "20 Ω の電熱器に 100 V の電圧を 3.0 分間加えた。発生するジュール熱は何 kJ か。数値のみを答えよ。"
      placeholder: "例: 90"
    validations:
      required: true
  - type: checkboxes
    id: consent
    attributes:
      label: 公開回答への同意
      options:
        - label: 回答が公開されることを理解し、公開に同意します
          required: true