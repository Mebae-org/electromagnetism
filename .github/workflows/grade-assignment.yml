name: 課題を自動採点

on:
  issues:
    types: [opened, edited, reopened]

permissions:
  contents: read
  issues: write

concurrency:
  group: assignment-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  grade:
    runs-on: ubuntu-latest
    steps:
      - name: 教材を取得
        uses: actions/checkout@v4

      - name: 数値回答を採点
        uses: actions/github-script@v7
        with:
          script: |
            const grade = require("./.github/scripts/grade-assignment.js");
            await grade({ github, context, core });
